[workspace]
resolver = "2"
members = [
    "crates/webclone-core",
    "crates/webclone-cli",
    "crates/webclone-gui",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["何工"]
repository = "https://github.com/hexiyou/WebClone-rs"

[workspace.dependencies]
webclone-core = { path = "crates/webclone-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
encoding_rs = "0.8"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
percent-encoding = "2"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
